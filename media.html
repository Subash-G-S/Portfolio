<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zygn Media</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #f5efe6;
  --text: #1a1a1a;
  --muted: #7a736b;
  --accent: #d8c3a5;
  --line: #ded6cc;
  --ease: cubic-bezier(0.76, 0, 0.24, 1);
}

body {
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

/* soft drifting gradient */
body::after {
  content: "";
  position: absolute;
  width: 180%;
  height: 180%;
  background: radial-gradient(circle at 60% 40%, rgba(216,195,165,0.25), transparent 60%);
  animation: drift 18s ease-in-out infinite;
}

@keyframes drift {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(-6%, -8%); }
}

/* subtle paper grain */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: url('https://www.transparenttextures.com/patterns/paper.png');
  opacity: 0.25;
}

/* container */
.container {
  text-align: center;
  z-index: 2;
  max-width: 720px;
  padding: 24px;
}

/* title */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 6vw, 4.2rem);
  font-weight: 400;
  letter-spacing: 1px;
  opacity: 0;
  transform: translateY(30px);
  animation: reveal 1.2s var(--ease) forwards, float 8s ease-in-out infinite 2s;
}

h1 span {
  font-weight: 600;
}

/* reveal */
@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* slow float */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* divider */
.line {
  margin: 28px auto;
  width: 0;
  height: 1px;
  background: var(--line);
  animation: expand 1.5s var(--ease) forwards, soften 5s ease-in-out infinite 2s;
}

@keyframes expand {
  to { width: 55%; }
}

@keyframes soften {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* text */
p {
  margin-top: 18px;
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  color: var(--muted);
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  animation: reveal 1s var(--ease) forwards 0.6s;
}

/* brand */
.brand {
  margin-top: 36px;
  font-size: 0.75rem;
  letter-spacing: 4px;
  color: #8a8178;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards 1.2s, breathe 6s ease-in-out infinite 2s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* subtle breathing */
@keyframes breathe {
  0%,100% { letter-spacing: 4px; opacity: 0.6; }
  50% { letter-spacing: 5px; opacity: 1; }
}

/* light sweep (very soft, not flashy) */
.sweep {
  position: absolute;
  top: 0;
  left: -120%;
  width: 35%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );
  animation: sweep 10s infinite;
  opacity: 0.4;
}

@keyframes sweep {
  0% { left: -120%; }
  100% { left: 150%; }
}

/* mobile tuning */
@media (max-width: 640px) {
  .container {
    padding: 18px;
  }

  .line {
    width: 65%;
  }

  .brand {
    letter-spacing: 3px;
  }
}

@media (max-width: 380px) {
  h1 {
    font-size: 2.2rem;
  }

  p {
    font-size: 0.9rem;
  }
}
</style>
</head>

<body>

<div class="sweep"></div>

<div class="container">
  <h1><span>Under</span><div style="color: brown;">Development</div></h1>
  <div class="line"></div>
  <p>
    A visual portfolio shaped with clarity, elegance, and storytelling.  
    Currently in progress.
  </p>
  <div class="brand">ZYGN MEDIA</div>
</div>

</body>
</html>
