<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subash — Two Worlds</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ease: cubic-bezier(0.76, 0, 0.24, 1); --d-glow: #5effa0; --c-glow: #f5c97a; }

  html, body { width: 100%; height: 100%; overflow: hidden; background: #030308; }

  /* Desktop cursor */
  @media (hover: hover) {
    body { cursor: none; }
    #cursor {
      position: fixed; width: 12px; height: 12px; border-radius: 50%;
      background: #fff; pointer-events: none; z-index: 9999;
      mix-blend-mode: difference;
      transition: width 0.3s var(--ease), height 0.3s var(--ease);
      transform: translate(-50%, -50%);
    }
    #cursor.expand { width: 44px; height: 44px; }
  }
  @media (hover: none) { #cursor { display: none; } }

  /* ── STAGE ── */
  .stage {
    width: 100vw; height: 100dvh;
    display: flex;
    flex-direction: row;
    position: relative;
  }

  /* ── PANELS ── */
  .panel {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex: 1;
    transition: flex 0.7s var(--ease);
  }
  .panel-dev { background: #060610; }
  .panel-cin { background: #0c0805; }

  /* Desktop hover expand */
  @media (hover: hover) {
    .stage.hover-dev .panel-dev { flex: 1.15; }
    .stage.hover-dev .panel-cin { flex: 0.85; }
    .stage.hover-cin .panel-cin { flex: 1.15; }
    .stage.hover-cin .panel-dev { flex: 0.85; }
  }

  .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ── CONTENT ── */
  .content {
    position: relative; z-index: 10; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem;
  }

  .role-tag {
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.48rem, 1.5vw, 0.58rem);
    font-weight: 300; letter-spacing: 0.32em; text-transform: uppercase;
    margin-bottom: 1.4rem; opacity: 0;
    animation: riseIn 1s var(--ease) 0.7s forwards;
    white-space: nowrap;
  }
  .panel-dev .role-tag { color: var(--d-glow); }
  .panel-cin .role-tag { color: var(--c-glow); }

  .big-name {
    font-family: 'Playfair Display', serif; font-weight: 300;
    font-size: clamp(4rem, 8vw, 8rem);
    white-space: nowrap;
    line-height: 0.88; letter-spacing: -0.02em; opacity: 0;
    animation: riseIn 1.1s var(--ease) 0.3s forwards;
  }
  .panel-dev .big-name { color: #dde0f5; }
  .panel-cin .big-name { color: #f0e0c0; }
  .big-name em { font-style: italic; display: inline; }
  .panel-dev .big-name em { color: var(--d-glow); }
  .panel-cin .big-name em { color: var(--c-glow); }

  .descriptor {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.5rem, 1.5vw, 0.72rem);
    font-weight: 200; letter-spacing: 0.18em; text-transform: uppercase;
    margin-top: 1.2rem; margin-bottom: 2rem; opacity: 0;
    animation: riseIn 1s var(--ease) 1s forwards;
    white-space: nowrap;
  }
  .panel-dev .descriptor { color: #6668aa; }
  .panel-cin .descriptor { color: #9a8060; }

  .enter-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.5rem, 1.5vw, 0.58rem);
    letter-spacing: 0.28em; text-transform: uppercase; text-decoration: none;
    padding: 0.8rem 2rem; border-radius: 100px; opacity: 0;
    transform: translateY(10px);
    animation: riseIn 1s var(--ease) 1.2s forwards;
    transition: all 0.4s var(--ease);
    white-space: nowrap;
  }
  .panel-dev .enter-btn { border: 1px solid #5effa035; color: var(--d-glow); }
  .panel-dev .enter-btn:hover { background: #5effa012; border-color: #5effa070; gap: 12px; }
  .panel-cin .enter-btn { border: 1px solid #f5c97a35; color: var(--c-glow); }
  .panel-cin .enter-btn:hover { background: #f5c97a10; border-color: #f5c97a70; gap: 12px; }

  .arrow { display: inline-block; transition: transform 0.4s var(--ease); }
  .enter-btn:hover .arrow { transform: translateX(4px); }

  .float-tag {
    position: absolute; bottom: 1.6rem;
    font-family: 'DM Mono', monospace; font-size: 0.42rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    z-index: 20; opacity: 0;
    animation: fadeIn 1s ease 1.6s forwards;
  }
  .panel-dev .float-tag { color: #5effa025; }
  .panel-cin .float-tag { color: #f5c97a25; }

  .spotlight {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity 0.9s ease;
  }
  .panel:hover .spotlight { opacity: 1; }
  .panel-dev .spotlight { background: radial-gradient(ellipse 60% 55% at 50% 65%, #5effa008, transparent 80%); }
  .panel-cin .spotlight { background: radial-gradient(ellipse 60% 55% at 50% 35%, #f5c97a07, transparent 80%); }

  .scan { position: absolute; left: 0; right: 0; height: 1px; pointer-events: none; z-index: 5; opacity: 0; }
  .panel-dev .scan { background: linear-gradient(90deg, transparent, #5effa022, transparent); animation: scanMove 9s linear 2.5s infinite; }
  .panel-cin .scan { background: linear-gradient(90deg, transparent, #f5c97a16, transparent); animation: scanMove 13s linear 4s infinite; }
  @keyframes scanMove { 0%{top:-1px;opacity:0} 4%{opacity:1} 96%{opacity:.5} 100%{top:100%;opacity:0} }

  /* ── DESKTOP DIVIDER (vertical) ── */
  .divider {
    position: absolute; left: 0; top: 0; bottom: 0;
    transform: none; width: 1px;
    transition: left 0.7s var(--ease-in);
    z-index: 50; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .div-line {
    flex: 1; width: 1px;
    background: linear-gradient(to bottom, transparent, #ffffff14 40%, #ffffff14 60%, transparent);
    opacity: 0; animation: fadeIn 1.5s ease 1.3s forwards;
  }
  .div-badge {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 1.8rem 0;
    opacity: 0; animation: fadeIn 1.2s ease 1.1s forwards;
  }
  .div-letter {
    font-family: 'Playfair Display', serif; font-size: 1.8rem;
    font-weight: 300; font-style: italic; color: #ffffff38; line-height: 1;
  }
  .div-sub {
    font-family: 'DM Mono', monospace; font-size: 0.38rem;
    letter-spacing: 0.45em; text-transform: uppercase;
    color: #ffffff18; white-space: nowrap;
  }

  @keyframes riseIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .veil {
    position: fixed; inset: 0; background: #030308;
    z-index: 500; pointer-events: none;
    animation: veilLift 1.2s var(--ease) 0.1s forwards;
  }
  @keyframes veilLift { 0%{opacity:1} 100%{opacity:0} }

  /* ════════════════════════════════
     MOBILE  (≤640px)
  ════════════════════════════════ */
  @media (max-width: 640px) {
    html, body { overflow: hidden; }

    .stage {
      flex-direction: column;
    }

    .panel {
      flex: 1;
      transition: flex 0.6s var(--ease);
    }

    /* Tap-to-expand on mobile via JS class */
    .stage.tap-dev .panel-dev   { flex: 1.22; }
    .stage.tap-dev .panel-cin   { flex: 0.78; }
    .stage.tap-cin .panel-cin   { flex: 1.22; }
    .stage.tap-cin .panel-dev   { flex: 0.78; }

    /* name size */
    .big-name { font-size: clamp(3rem, 12vw, 4.5rem); }

    /* role tag / descriptor / button — larger touch-friendly */
    .role-tag { font-size: 0.6rem; letter-spacing: 0.28em; margin-bottom: 1rem; }
    .descriptor { font-size: 0.58rem; letter-spacing: 0.16em; margin-top: 0.9rem; margin-bottom: 1.6rem; }
    .enter-btn { font-size: 0.6rem; padding: 0.85rem 2.2rem; letter-spacing: 0.24em; }

    /* float tags hidden on small screens — too cramped */
    .float-tag { display: none; }

    /* ── MOBILE DIVIDER (horizontal) ── */
    .divider {
      left: 0; right: 0; top: 50%; bottom: auto;
      width: 100%; height: 1px;
      transform: translateY(-50%);
      flex-direction: row;
    }
    .div-line {
      flex: 1; width: auto; height: 1px;
      background: linear-gradient(to right, transparent, #ffffff14 40%, #ffffff14 60%, transparent);
    }
    .div-badge {
      flex-direction: column; padding: 0 1.4rem; gap: 5px;
    }
    .div-letter { font-size: 1.4rem; }
    .div-sub { font-size: 0.34rem; letter-spacing: 0.35em; }
  }

  /* Very small phones */
  @media (max-width: 380px) {
    .big-name { font-size: 2.6rem; }
    .descriptor { white-space: normal; text-align: center; font-size: 0.52rem; }
    .enter-btn { padding: 0.75rem 1.8rem; }
  }
</style>
</head>
<body>

<div class="veil"></div>
<div id="cursor"></div>

<div class="stage" id="stage">

  <div class="panel panel-dev" id="panelDev">
    <canvas id="cvsDev"></canvas>
    <div class="spotlight"></div>
    <div class="scan"></div>
    <div class="content">
      <div class="role-tag">Software Development</div>
      <div class="big-name">Sub<em>ash</em></div>
      <div class="descriptor">Full-Stack · Systems · Problem Solver</div>
      <!-- 🔗 Replace href with your developer portfolio URL -->
      <a class="enter-btn" href="dev.html">Enter <span class="arrow">→</span></a>
    </div>
    <div class="float-tag">{ build · create · ship }</div>
  </div>

  <div class="panel panel-cin" id="panelCin">
    <canvas id="cvsCin"></canvas>
    <div class="spotlight"></div>
    <div class="scan"></div>
    <div class="content">
      <div class="role-tag">Cinema & Photography</div>
      <div class="big-name">Sub<em>ash</em></div>
      <div class="descriptor">Frames · Light · Storytelling</div>
      <!-- 🔗 Replace href with your cinematographer portfolio URL -->
      <a class="enter-btn" href="media.html">Enter <span class="arrow">→</span></a>
    </div>
    <div class="float-tag">[ frame · expose · tell ]</div>
  </div>

  <div class="divider">
    <div class="div-line"></div>
    <div class="div-badge">
      <div class="div-letter">S</div>
      <div class="div-sub">choose your world</div>
    </div>
    <div class="div-line"></div>
  </div>

</div>

<script>
  /* ── Custom cursor (desktop only) ── */
  const cursor = document.getElementById('cursor');
  if (cursor && window.matchMedia('(hover: hover)').matches) {
    let mx=innerWidth/2, my=innerHeight/2, cx=mx, cy=my;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    document.querySelectorAll('a,.panel').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
    });
    (function tick(){ cx+=(mx-cx)*0.1; cy+=(my-cy)*0.1; cursor.style.left=cx+'px'; cursor.style.top=cy+'px'; requestAnimationFrame(tick); })();
  }

  /* ── Panel interactions ── */
  const stage = document.getElementById('stage');
  const devPanel = document.getElementById('panelDev');
  const cinPanel = document.getElementById('panelCin');
  const isMobile = () => window.innerWidth <= 640;
  function updateDivider() {
  const devWidth = devPanel.getBoundingClientRect().width;
  divider.style.left = devWidth + "px";
}

const divider = document.querySelector('.divider');

/* Run on load */
updateDivider();

/* Run on resize */
window.addEventListener('resize', updateDivider);

/* Run continuously during animation */
function track() {
  updateDivider();
  requestAnimationFrame(track);
}
track();

  /* Desktop hover */
  devPanel.addEventListener('mouseenter', () => { if(!isMobile()){ stage.classList.add('hover-dev'); stage.classList.remove('hover-cin'); }});
  cinPanel.addEventListener('mouseenter', () => { if(!isMobile()){ stage.classList.add('hover-cin'); stage.classList.remove('hover-dev'); }});
  stage.addEventListener('mouseleave', () => { if(!isMobile()) stage.classList.remove('hover-dev','hover-cin'); });

  /* Mobile tap-to-expand (only on panel bg, not the button) */
  devPanel.addEventListener('click', e => {
    if (!isMobile()) return;
    if (e.target.closest('a')) return;
    const isActive = stage.classList.contains('tap-dev');
    stage.classList.remove('tap-dev','tap-cin');
    if (!isActive) stage.classList.add('tap-dev');
  });
  cinPanel.addEventListener('click', e => {
    if (!isMobile()) return;
    if (e.target.closest('a')) return;
    const isActive = stage.classList.contains('tap-cin');
    stage.classList.remove('tap-dev','tap-cin');
    if (!isActive) stage.classList.add('tap-cin');
  });

  /* ── Dev canvas — drifting code words ── */
  (function(){
    const canvas=document.getElementById('cvsDev'), ctx=canvas.getContext('2d');
    const words=['01','{}','()','=> ','const','let','async','fn','import','class','return','if','for','null','true','</>'];
    let P=[], W, H;
    function resize(){ W=canvas.offsetWidth; H=canvas.offsetHeight; canvas.width=W; canvas.height=H; }
    resize(); window.addEventListener('resize', resize);
    class Pt {
      constructor(r){ this.reset(r); }
      reset(r=false){
        this.x=Math.random()*W; this.y=r?Math.random()*H:-20;
        this.vy=0.2+Math.random()*0.4; this.vx=(Math.random()-.5)*0.1;
        this.op=0; this.top=0.05+Math.random()*0.14;
        this.w=words[Math.floor(Math.random()*words.length)];
        this.sz=9+Math.floor(Math.random()*5);
        this.life=0; this.max=200+Math.random()*400;
      }
      update(){
        this.x+=this.vx; this.y+=this.vy; this.life++;
        if(this.life<35) this.op+=this.top/35;
        else if(this.life>this.max-50) this.op-=this.top/50;
        if(this.life>this.max||this.y>H+20) this.reset();
      }
      draw(){
        ctx.globalAlpha=Math.max(0,this.op);
        ctx.fillStyle='#5effa0';
        ctx.font=`300 ${this.sz}px "DM Mono",monospace`;
        ctx.fillText(this.w,this.x,this.y);
      }
    }
    for(let i=0;i<28;i++) P.push(new Pt(true));
    (function loop(){ ctx.clearRect(0,0,W,H); P.forEach(p=>{p.update();p.draw();}); ctx.globalAlpha=1; requestAnimationFrame(loop); })();
  })();

  /* ── Cin canvas — bokeh + dust ── */
  (function(){
    const canvas=document.getElementById('cvsCin'), ctx=canvas.getContext('2d');
    let P=[], W, H;
    function resize(){ W=canvas.offsetWidth; H=canvas.offsetHeight; canvas.width=W; canvas.height=H; }
    resize(); window.addEventListener('resize', resize);
    class Orb {
      constructor(r){ this.reset(r); }
      reset(r=false){
        this.x=Math.random()*W; this.y=r?Math.random()*H:H+80;
        this.rad=22+Math.random()*90;
        this.vy=-(0.1+Math.random()*0.18); this.vx=(Math.random()-.5)*0.1;
        this.op=0; this.top=0.035+Math.random()*0.08;
        this.hue=28+Math.random()*22;
        this.life=0; this.max=450+Math.random()*600;
      }
      update(){
        this.x+=this.vx; this.y+=this.vy; this.life++;
        if(this.life<70) this.op+=this.top/70;
        else if(this.life>this.max-90) this.op-=this.top/90;
        if(this.life>this.max||this.y<-this.rad-60) this.reset();
      }
      draw(){
        ctx.globalAlpha=Math.max(0,this.op);
        const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.rad);
        g.addColorStop(0,`hsl(${this.hue},78%,70%)`); g.addColorStop(1,'transparent');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,this.rad,0,Math.PI*2); ctx.fill();
      }
    }
    class Dust {
      constructor(r){ this.reset(r); }
      reset(r=false){
        this.x=Math.random()*W; this.y=r?Math.random()*H:H+5;
        this.rad=0.7+Math.random()*1.8;
        this.vy=-(0.06+Math.random()*0.18); this.vx=(Math.random()-.5)*0.08;
        this.op=0; this.top=0.1+Math.random()*0.25;
        this.life=0; this.max=300+Math.random()*450;
      }
      update(){
        this.x+=this.vx; this.y+=this.vy; this.life++;
        if(this.life<50) this.op+=this.top/50;
        else if(this.life>this.max-60) this.op-=this.top/60;
        if(this.life>this.max||this.y<-5) this.reset();
      }
      draw(){
        ctx.globalAlpha=Math.max(0,this.op);
        ctx.fillStyle='#f5c97a';
        ctx.beginPath(); ctx.arc(this.x,this.y,this.rad,0,Math.PI*2); ctx.fill();
      }
    }
    for(let i=0;i<10;i++) P.push(new Orb(true));
    for(let i=0;i<42;i++) P.push(new Dust(true));
    (function loop(){ ctx.clearRect(0,0,W,H); P.forEach(p=>{p.update();p.draw();}); ctx.globalAlpha=1; requestAnimationFrame(loop); })();
  })();
</script>
</body>
</html>
